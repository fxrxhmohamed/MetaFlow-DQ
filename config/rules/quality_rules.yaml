# ==============================================================
# Quality rules: Egypt banking transactions
# ==============================================================
#
# Read by the Data Quality Engine (services/dq-service). Each rule
# detects a problem, optionally remediates it, and its severity decides
# what happens to rows that still fail:
#
#   critical -> the row goes to quarantine
#   warning  -> the row is accepted and flagged (dq_warnings column)
#   info     -> counted only
#
# Policy: identifiers and reference values come from the bank's systems,
# so a missing id or an unknown category means the record cannot be
# trusted (critical). Formatting problems (case, spacing, date and time
# layouts, number text, id separators) are repaired first; only values
# that cannot be repaired fail.
#
# Rules run in this order:
#   1. preprocessing   (whole-file clean-up)
#   2. schema_checks   (generated from config/metadata/schema_registry.yaml)
#   3. rules           (generated columns, business, cross-column and
#                       relationship rules, in file order)
#
# Common rule keys
#   id            unique, stable identifier (used in audit and results)
#   name          short description
#   type          see "Rule types" below
#   column        column the rule checks (and remediates)
#   dimension     completeness | validity | consistency | uniqueness |
#                 timeliness | integrity
#   severity      critical | warning | info
#   when          applicability: the rule only checks rows matching it
#   remediation   {action: <name>, ...options}; tried on failing values,
#                 which are then re-checked
#   on_accept     set_null | keep: what to do with a value that still
#                 fails when its row is accepted (default per section)
#   enabled       false to switch a rule off
#   error_code    code in the quarantine error list (default per rule
#                 type: DQ-NULL, DQ-TYPE, DQ-FMT, DQ-DOM, DQ-REF, DQ-RNG,
#                 DQ-DUP, DQ-BUS, DQ-CON)
#   message       error message template, e.g. "{column} '{value}' ..."
#                 (default per rule type)
#
# Rule types
#   not_null, is_null, allowed_values {values}, pattern {pattern},
#   range {min, max, exclusive_min, exclusive_max}, type, unique,
#   compare {left, operator, right, offset: {years|days}},
#   derived {source, format}, functional_dependency {entity|dependency},
#   duplicate_rows, trim_whitespace, null_tokens,
#   reference {reference: {path, column}}: value exists in a lookup file
#   expression {expression, columns}: a pandas expression over typed
#     columns that must hold, e.g. "abs(a - b * c) <= 0.01"; rows with a
#     missing input are not judged
#   generate {method: convert_currency {amount, currency, rates,
#            decimals} | case {cases: [{when, value}], default}}
#     fills a column marked "generated" in the schema; rows whose value
#     cannot be computed fail the rule
#   auto_fix_review {min_changes, ignore_actions}: a record that had
#     min_changes or more values repaired automatically fails, so a
#     person confirms it (ACCEPT), corrects it or removes it; always
#     checked after every other rule
#
# Conditions ("when")
#   {column: c, in: [..]} | {column: c, not_in: [..]} |
#   {column: c, equals: v} | {column: c, is_null: true} |
#   {column: c, not_null: true} | {all: [..]} | {any: [..]} | {not: {..}}
#   Conditions are evaluated on cleaned values (after schema checks).
#
# Remediation actions
#   trim, set_null {values?}, canonicalize {map?}, parse_number,
#   parse_date {formats}, parse_time, reformat_id {patterns, template},
#   replace {substitutions: [{pattern, replace}]}, derive,
#   swap_day_month, drop_duplicates
#   Add "target: <column>" to repair a different column than the one
#   checked (derived rules only).

version: 2
schema: config/metadata/schema_registry.yaml

severity_levels:
  critical:
    action: quarantine
    description: Record cannot be trusted or loaded; held for review.
  warning:
    action: accept_with_flag
    description: Record is usable; the issue is flagged for follow-up.
  info:
    action: accept
    description: Observation only.


# --------------------------------------------------------------
# 1. Preprocessing
# --------------------------------------------------------------

preprocessing:

  - id: DQ-PRE-001
    name: Remove leading/trailing whitespace
    type: trim_whitespace
    columns: all
    dimension: validity
    severity: info
    remediation: {action: trim}

  - id: DQ-PRE-002
    name: Null placeholders become real nulls
    type: null_tokens
    columns: all
    dimension: completeness
    severity: info
    remediation: {action: set_null}

  - id: DQ-PRE-003
    name: Exact duplicate rows are removed
    type: duplicate_rows
    dimension: uniqueness
    severity: info
    remediation: {action: drop_duplicates}


# --------------------------------------------------------------
# 2. Schema checks (generated from the schema registry)
# --------------------------------------------------------------
#
# One rule per column and check, with id SCH-<column>-<check>.
# Checks: type, pattern, allowed_values, range, not_null (nullable:
# false only), unique (unique: true only).
#
# Defaults are critical: a missing id, a non-number in a number column,
# a value outside a lookup list or a range breach quarantines the row.
# Lookup values are canonicalised first ('ATM ', 'atm', 'Mobile_App').

schema_checks:
  defaults:
    type:           {severity: critical, dimension: validity}
    pattern:        {severity: critical, dimension: validity}
    allowed_values: {severity: critical, dimension: validity,
                     remediation: {action: canonicalize}}
    reference:      {severity: critical, dimension: integrity,
                     remediation: {action: canonicalize}}
    range:          {severity: critical, dimension: validity}
    not_null:       {severity: critical, dimension: completeness}
    unique:         {severity: critical, dimension: uniqueness}
  # Values that still fail a schema value check in an accepted row are
  # nulled, so accepted data always loads with its declared types.
  on_accept: set_null

  columns:

    # ---- Transaction ----

    # Not null, TXN + 10 digits, no duplicates (both copies of a repeated
    # id are quarantined).
    transaction_id:
      pattern:
        remediation:
          action: reformat_id
          # 'txn-0000000001' -> 'TXN0000000001'
          patterns: ['^TXN[\s_-]?(\d{10})$']
          template: "TXN{0}"

    # One layout: YYYY-MM-DD.
    transaction_date:
      type:
        remediation:
          action: parse_date
          # 2024/05/01, 27-09-2022, 14/08/2025 (day first), 07 Sep 2023
          formats: &date_formats
            ["%Y/%m/%d", "%d-%m-%Y", "%d/%m/%Y", "%d %b %Y", "%d-%b-%Y",
             "%d-%b-%y", "%Y%m%d", "%Y-%m-%d"]
      range: {dimension: timeliness}

    # One layout: HH:MM:SS on a 24-hour clock.
    transaction_time:
      type:
        # '07:19:20 PM' -> '19:19:20', '12.30.15' -> '12:30:15'
        remediation: {action: parse_time}

    # A number above 0.
    transaction_amount:
      type:
        remediation: {action: parse_number}

    currency:
      # allowed_values is stricter than the pattern.
      pattern: {enabled: false}
      allowed_values:
        remediation:
          action: canonicalize
          map:
            "LE": EGP
            "L.E.": EGP
            "E£": EGP
            "EG": EGP
            "جنيه": EGP
            "ج.م": EGP

    # Fee, balance and channel cost: numbers, zero allowed, never negative.
    transaction_fee:
      type:
        remediation: {action: parse_number}

    balance_after_transaction:
      type:
        remediation: {action: parse_number}

    estimated_channel_cost_egp:
      type:
        remediation: {action: parse_number}

    # ---- Channel ----
    # transaction_type, transaction_status, card_type, channel_feature,
    # digital_feature_use: lookup lists, anything else is quarantined
    # (schema defaults). channel, merchant_name, merchant_category and
    # failure_reason accept 'Other'.

    login_success:
      type: {severity: warning}

    session_duration_seconds:
      type:
        severity: warning
        remediation: {action: parse_number}
      range: {severity: warning}

    attempt_count:
      type:
        severity: warning
        remediation: {action: parse_number}
      range: {severity: warning}

    # ---- Account ----

    # Not null, ACC + 7 digits.
    account_id:
      pattern:
        remediation:
          action: reformat_id
          # '66821' or 'acc-66821' -> 'ACC0066821'
          patterns: ['^(\d{1,7})$', '^ACC[\s_-]?(\d{1,7})$']
          template: "ACC{0:0>7}"

    # One layout: YYYY-MM-DD.
    account_open_date:
      type:
        remediation:
          action: parse_date
          formats: *date_formats

    # 0-100 %.
    interest_rate:
      type:
        remediation: {action: parse_number}

    # ---- Customer ----

    # Not null (repeats are expected: one customer, many transactions).
    customer_id:
      pattern:
        remediation:
          action: reformat_id
          # 'c-018743' -> 'CUST018743'
          patterns: ['^(?:CUST|C)[\s_-]?(\d{6})$']
          template: "CUST{0}"

    # Names: letters with single spaces, hyphens or apostrophes. Tags and
    # stray symbols are removed; what is left must match, and a name with
    # nothing left becomes null and is quarantined by the not-null check.
    customer_first_name:
      pattern:
        remediation: &name_repair
          action: replace
          substitutions:
            # 'BUSINESS_REVIEW_Karim' -> 'Karim'
            - {pattern: '^(?:[A-Z]+_)+(?=[A-Z][a-z])', replace: ''}
            # 'O?Connor' -> "O'Connor" (lost apostrophe)
            - {pattern: '(?<=[A-Za-z])\?(?=[A-Za-z])', replace: "'"}
            # 'Ali@#' -> 'Ali', '????' -> ''
            - {pattern: "[^A-Za-z' -]", replace: ''}
            - {pattern: '\s+', replace: ' '}

    customer_last_name:
      pattern:
        remediation: *name_repair

    # At least 18 years old today (schema max: today-18y).
    date_of_birth:
      type:
        remediation:
          action: parse_date
          formats: *date_formats

    # Starts with a letter, exactly one @, ends with .com.
    email:
      pattern: {severity: warning}

    # Validated by DQ-CUS-001 according to country_code.
    phone_number:
      pattern: {enabled: false}

    # City and occupation: must be a known text value; unknown ones are
    # flagged and nulled, not quarantined.
    customer_city:
      allowed_values: {severity: warning}
      not_null: {severity: warning}

    occupation:
      allowed_values: {severity: warning}

    # customer_governorate: one of the 27 governorates (schema default,
    # quarantined otherwise).

    # Above 0.
    annual_income:
      type:
        remediation: {action: parse_number}

    # 300-850.
    credit_score:
      type:
        remediation: {action: parse_number}

    # Not in the future.
    customer_since_date:
      type:
        remediation:
          action: parse_date
          formats: *date_formats
      range: {dimension: timeliness}

    # ---- Bank and branch ----
    # bank_name, bank_type (public/private), branch_name, branch_city,
    # branch_governorate and branch_region: lookup lists, quarantined
    # otherwise. bank_id, branch_id, bank_name, branch_name: not null.

    bank_id:
      pattern:
        remediation:
          action: reformat_id
          # 'bnk-4' -> 'BNK04'
          patterns: ['^BNK[\s_-]?(\d{1,2})$']
          template: "BNK{0:0>2}"

    branch_id:
      pattern:
        remediation:
          action: reformat_id
          # 'br-18' -> 'BR018'
          patterns: ['^BR[\s_-]?(\d{1,3})$']
          template: "BR{0:0>3}"


# --------------------------------------------------------------
# 3. Generated columns, business, cross-column and relationship rules
# --------------------------------------------------------------

rules:

  # ---- Generated columns (run first; later rules use them) ----

  - id: DQ-GEN-001
    name: amount_egp is transaction_amount in EGP
    type: generate
    column: amount_egp
    method: convert_currency
    amount: transaction_amount
    currency: currency
    # EGP per unit of currency. USD as given; SAR and AED from their USD
    # pegs (3.75, 3.6725); EUR assumes 1 EUR = 1.08 USD. Update together.
    rates:
      EGP: 1
      USD: 52.40
      EUR: 56.59
      SAR: 13.97
      AED: 14.27
    decimals: 2
    dimension: consistency
    severity: critical

  - id: DQ-BUS-001
    name: EGP amounts are not converted
    type: expression
    expression: abs(amount_egp - transaction_amount) <= 0.01
    columns: [amount_egp, transaction_amount]
    when: {column: currency, equals: EGP}
    dimension: consistency
    severity: critical
    message: "amount_egp {value} differs from transaction_amount for an EGP transaction"

  - id: DQ-BUS-002
    name: The fee does not exceed the transaction amount
    type: expression
    expression: transaction_fee <= transaction_amount
    columns: [transaction_fee, transaction_amount]
    dimension: validity
    severity: warning
    message: "transaction_fee {value} is larger than the transaction amount"

  - id: DQ-GEN-002
    name: digital_migration_opportunity is 1 only for assisted transactions that could be digital
    type: generate
    column: digital_migration_opportunity
    method: case
    cases:
      - when:
          all:
            - {column: channel, in: [ATM, Branch, Call Center]}
            - {column: transaction_type, in: [Transfer, Bill Payment, Loan Repayment]}
        value: "1"
    default: "0"
    dimension: consistency
    severity: warning

  - id: DQ-GEN-003
    name: country_code from customer_governorate
    type: generate
    column: country_code
    method: case
    cases:
      - when:
          column: customer_governorate
          in: [Alexandria, Assiut, Aswan, Beheira, Beni Suef, Cairo, Dakahlia,
               Damietta, Fayoum, Gharbia, Giza, Ismailia, Kafr El Sheikh,
               Luxor, Matrouh, Minya, Monufia, New Valley, North Sinai,
               Port Said, Qalyubia, Qena, Red Sea, Sharqia, Sohag,
               South Sinai, Suez]
        value: EG
    dimension: completeness
    severity: warning

  # ---- Customer contact ----

  - id: DQ-CUS-001
    name: Egyptian phone numbers have 11 digits and a mobile prefix (010, 011, 012, 015)
    type: pattern
    column: phone_number
    pattern: '^01[0125]\d{8}$'
    when: {column: country_code, equals: EG}
    dimension: validity
    severity: warning
    # '010-1234-5678' -> '01012345678', '+201012345678' -> '01012345678'
    remediation:
      action: replace
      substitutions:
        - {pattern: '[\s().-]', replace: ''}
        - {pattern: '^(?:\+|00)20(?=1)', replace: '0'}
    on_accept: set_null

  # ---- Channel consistency ----

  - id: DQ-CON-002
    name: Digital channels have digital_channel_flag = 1
    type: allowed_values
    column: digital_channel_flag
    values: ["1"]
    when: &digital_channel {column: channel, in: [InstaPay, Internet Banking, Mobile App]}
    dimension: consistency
    severity: warning

  - id: DQ-CON-003
    name: Assisted channels have digital_channel_flag = 0
    type: allowed_values
    column: digital_channel_flag
    values: ["0"]
    when: &assisted_channel {column: channel, in: [ATM, Branch, Call Center, POS, System]}
    dimension: consistency
    severity: warning

  - id: DQ-CON-004
    name: Digital channels use Funds Transfer
    type: allowed_values
    column: digital_feature_use
    values: [Funds Transfer]
    when: *digital_channel
    dimension: consistency
    severity: warning

  - id: DQ-CON-005
    name: Assisted channels have no digital feature
    type: allowed_values
    column: digital_feature_use
    values: [Not Applicable]
    when: *assisted_channel
    dimension: consistency
    severity: warning

  - id: DQ-CON-006
    name: Digital channels are Digital/Self-Service
    type: allowed_values
    column: channel_feature
    values: [Digital/Self-Service]
    when: *digital_channel
    dimension: consistency
    severity: warning

  - id: DQ-CON-007
    name: Assisted channels are Assisted/Physical
    type: allowed_values
    column: channel_feature
    values: [Assisted/Physical]
    when: *assisted_channel
    dimension: consistency
    severity: warning

  # ---- Conditional completeness (applicability) ----

  - id: DQ-CMP-001
    name: login_success is required on digital channels
    type: not_null
    column: login_success
    when: {column: digital_channel_flag, equals: "1"}
    dimension: completeness
    severity: warning

  - id: DQ-CMP-002
    name: login_success is empty on assisted channels
    type: is_null
    column: login_success
    when: {column: digital_channel_flag, equals: "0"}
    dimension: consistency
    severity: warning
    remediation: {action: set_null}

  - id: DQ-CMP-005
    name: card_type is required at ATMs
    type: not_null
    column: card_type
    when: {column: channel, equals: ATM}
    dimension: completeness
    severity: warning

  - id: DQ-CMP-006
    name: card_type is empty for non-card channels
    type: is_null
    column: card_type
    when: {column: channel, in: [Branch, Call Center, InstaPay, System]}
    dimension: consistency
    severity: warning
    remediation: {action: set_null}

  - id: DQ-CMP-007
    name: merchant_name is required for purchases and bill payments
    type: not_null
    column: merchant_name
    when: &merchant {column: transaction_type, in: [Purchase, Bill Payment]}
    dimension: completeness
    severity: warning

  - id: DQ-CMP-008
    name: merchant_name is empty for non-merchant transactions
    type: is_null
    column: merchant_name
    when: &non_merchant
      column: transaction_type
      in: [Deposit, Fee, Interest Credit, Loan Repayment, Transfer, Withdrawal]
    dimension: consistency
    severity: warning
    remediation: {action: set_null}

  - id: DQ-CMP-009
    name: merchant_category is required for purchases and bill payments
    type: not_null
    column: merchant_category
    when: *merchant
    dimension: completeness
    severity: warning

  - id: DQ-CMP-010
    name: merchant_category is empty for non-merchant transactions
    type: is_null
    column: merchant_category
    when: *non_merchant
    dimension: consistency
    severity: warning
    remediation: {action: set_null}

  - id: DQ-CMP-011
    name: failure_reason is required for failed transactions
    type: not_null
    column: failure_reason
    when: {column: transaction_status, equals: Failed}
    dimension: completeness
    severity: warning

  - id: DQ-CMP-012
    name: failure_reason is empty unless the transaction failed
    type: is_null
    column: failure_reason
    when: {column: transaction_status, in: [Completed, Pending, Reversed]}
    dimension: consistency
    severity: warning
    remediation: {action: set_null}

  # ---- Business values ----

  - id: DQ-VAL-001
    name: Only transfers and withdrawals carry a fee
    type: range
    column: transaction_fee
    min: 0
    max: 0
    when:
      column: transaction_type
      in: [Bill Payment, Deposit, Fee, Interest Credit, Loan Repayment, Purchase]
    dimension: validity
    severity: warning

  - id: DQ-VAL-002
    name: Current accounts pay 0.5% interest
    type: range
    column: interest_rate
    min: 0.5
    max: 0.5
    when: {column: account_type, equals: Current}
    dimension: validity
    severity: warning

  - id: DQ-VAL-003
    name: Savings interest between 5% and 15%
    type: range
    column: interest_rate
    min: 5
    max: 15
    when: {column: account_type, equals: Savings}
    dimension: validity
    severity: warning

  - id: DQ-VAL-004
    name: Certificate of Deposit and Loan interest between 15% and 30%
    type: range
    column: interest_rate
    min: 15
    max: 30
    when: {column: account_type, in: [Certificate of Deposit, Loan]}
    dimension: validity
    severity: warning

  - id: DQ-VAL-005
    name: Credit card interest between 30% and 45%
    type: range
    column: interest_rate
    min: 30
    max: 45
    when: {column: account_type, equals: Credit Card}
    dimension: validity
    severity: warning

  # ---- Timeline ----

  - id: DQ-TML-001
    name: Transaction is not before the account was opened
    type: compare
    left: transaction_date
    operator: ">="
    right: account_open_date
    dimension: timeliness
    severity: critical

  - id: DQ-TML-002
    name: Account is not opened before the customer relationship started
    type: compare
    left: account_open_date
    operator: ">="
    right: customer_since_date
    dimension: timeliness
    severity: warning

  - id: DQ-TML-003
    name: Customer was at least 18 when the relationship started
    type: compare
    left: customer_since_date
    operator: ">="
    right: date_of_birth
    offset: {years: 18}
    dimension: timeliness
    severity: warning

  # ---- Relationships (entities from the schema registry) ----

  - id: DQ-REL-001
    name: Each account has one set of account attributes and one customer
    type: functional_dependency
    entity: account
    dimension: integrity
    severity: warning

  - id: DQ-REL-002
    name: Each customer has one set of customer attributes
    type: functional_dependency
    entity: customer
    dimension: integrity
    severity: warning

  - id: DQ-REL-003
    name: Each bank has one name and type
    type: functional_dependency
    entity: bank
    dimension: integrity
    severity: warning

  - id: DQ-REL-004
    name: Each branch has one set of branch attributes and one bank
    type: functional_dependency
    entity: branch
    dimension: integrity
    severity: warning

  - id: DQ-REL-005
    name: Each merchant has one category
    type: functional_dependency
    dependency: merchant
    dimension: consistency
    severity: warning

  - id: DQ-REL-006
    name: Each customer city lies in one governorate
    type: functional_dependency
    dependency: customer_location
    dimension: consistency
    severity: warning

  - id: DQ-REL-007
    name: Each branch city lies in one governorate and region
    type: functional_dependency
    dependency: branch_location
    dimension: consistency
    severity: warning

  # ---- Review of automatic repairs ----
  # Many automatic changes in one record are too much to trust blindly:
  # the record is held until a person accepts, corrects or removes it.
  # Add e.g. [trim] to ignore_actions to stop counting removed spaces.
  - id: DQ-REV-001
    name: Records with many automatic repairs are confirmed by a person
    type: auto_fix_review
    min_changes: 3
    ignore_actions: []
    dimension: validity
    severity: critical
